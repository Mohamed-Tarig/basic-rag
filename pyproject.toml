[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "basic-rag"
version = "0.1.0"
description = "A production-oriented RAG system built from scratch"
requires-python = ">=3.12"
dependencies = [
    "llama-index-core>=0.12,<1.0",
    "llama-index-readers-file>=0.4,<1.0",
    "llama-index-embeddings-huggingface>=0.5,<1.0",
    "llama-index-vector-stores-qdrant>=0.6,<1.0",
    "qdrant-client>=1.12,<2.0",
    "llama-index-postprocessor-sbert-rerank>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"